spring.application.name=clienteservice

server.port=8081

spring.datasource.url=jdbc:mysql://mysql-cliente:3306/cliente_db?createDatabaseIfNotExist=true
spring.datasource.username=root1234
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 
vehiculo.service.url=http://vehiculo-service:8080

# Configuración de Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html