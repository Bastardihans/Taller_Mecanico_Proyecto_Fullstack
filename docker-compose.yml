services:

  eureka-server:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: always
    ports:
      - "8761:8761"
    networks:
      - taller-net

  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CLIENTE_SERVICE_URL: http://cliente-service:8081
      VEHICULO_SERVICE_URL: http://vehiculo-service:8080
      MECANICO_SERVICE_URL: http://mecanico-service:8082
      ORDENTRABAJO_SERVICE_URL: http://ordentrabajoservice:8083
      AGENDA_SERVICE_URL: http://agenda-service:8083
      SERVICIO_SERVICE_URL: http://servicio-service:8084
      REPUESTO_SERVICE_URL: http://repuestos-service:8089
      NOTIFICACION_SERVICE_URL: http://notificacion-service:8085
      FACTURACION_SERVICE_URL: http://facturacion-service:8086
      SEGURIDAD_SERVICE_URL: http://seguridad-service:8087
    ports:
      - "8080:8080"
    networks:
      - taller-net

  mysql:
    image: mysql:8.0
    container_name: mysql-taller
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taller_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3315:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taller-net

  mysql-cliente:
    image: mysql:8.0
    container_name: mysql-cliente
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cliente_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3308:3306"
    volumes:
      - mysql_cliente_data:/var/lib/mysql
    networks:
      - taller-net
  
  mysql-mecanico:
    image: mysql:8.0
    container_name: mysql-mecanico
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mecanico_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3309:3306"
    volumes:
      - mysql_mecanico_data:/var/lib/mysql
    networks:
      - taller-net

  cliente-service:
    build:
      context: ./clienteservice
      dockerfile: Dockerfile
    container_name: cliente-service
    restart: always
    depends_on:
      - mysql-cliente
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-cliente:3306/cliente_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      VEHICULO_SERVICE_URL: http://vehiculo-service:8080 
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
       - "8081:8081"
    networks:
      - taller-net

  vehiculo-service:
    build:
      context: ./VehiculoService
      dockerfile: Dockerfile
    container_name: vehiculo-service
    restart: always
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=taller_db
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - CLIENTE_SERVICE_URL=http://cliente-service:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
       - "18080:8080"
    depends_on:
      - mysql
    networks:
      - taller-net

  mecanico-service:
    build:
      context: ./mecanicoservice
      dockerfile: Dockerfile
    container_name: mecanico-service
    restart: always
    depends_on:
      - mysql-mecanico
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-mecanico:3306/mecanico_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8092:8082" # <-- CORREGIDO: Cambiado puerto externo a 8092 para evitar el choque
    networks:
      - taller-net

  mysql-ordenes:
    image: mysql:8.0
    container_name: mysql-ordenes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ordenes_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3316:3306"
    volumes:
      - mysql_ordenes_data:/var/lib/mysql
    networks:
      - taller-net

  ordentrabajoservice:
    build:
      context: ./ordentrabajoservice
      dockerfile: Dockerfile.java
    container_name: ordentrabajoservice
    restart: always
    depends_on:
      - mysql-ordenes
      - vehiculo-service
      - mecanico-service
      - cliente-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ordenes:3306/ordenes_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      VEHICULO_SERVICE_URL: http://vehiculo-service:8080
      MECANICO_SERVICE_URL: http://mecanico-service:8082
      CLIENTE_SERVICE_URL: http://cliente-service:8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8088:8083"
    networks:
      - taller-net

