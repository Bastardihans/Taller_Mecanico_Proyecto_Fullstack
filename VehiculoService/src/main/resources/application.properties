# Nombre de la aplicación en el ecosistema de Spring
spring.application.name=vehiculo-service

# Puerto en el que correrá el servidor dentro del contenedor
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:taller_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# URL para el cliente Feign que conecta con Cliente-Service
cliente.service.url=${CLIENTE_SERVICE_URL:http://localhost:8091}