version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-taller
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taller_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taller-net

  mysql-cliente:
    image: mysql:8.0
    container_name: mysql-cliente
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cliente_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3308:3306"
    volumes:
      - mysql_cliente_data:/var/lib/mysql
    networks:
      - taller-net
  
  mysql-mecanico:
    image: mysql:8.0
    container_name: mysql-mecanico
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mecanico_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3309:3306"
    volumes:
      - mysql_mecanico_data:/var/lib/mysql
    networks:
      - taller-net

  vehiculo-service:
    build: ./VehiculoService
    container_name: vehiculo-service
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taller_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8080:8080"
    networks:
      - taller-net

  cliente-service:
    build: ./clienteservice
    container_name: cliente-service
    restart: always
    depends_on:
      - mysql-cliente
      - vehiculo-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-cliente:3306/cliente_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      VEHICULO_SERVICE_URL: http://vehiculo-service:8080
    ports:
      - "8081:8081"
    networks:
      - taller-net
  
  mecanico-service:
    build: ./mecanicoservice
    container_name: mecanico-service
    restart: always
    depends_on:
      - mysql-mecanico
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-mecanico:3306/mecanico_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8082:8082"
    networks:
      - taller-net

volumes:
  mysql_data:
  mysql_cliente_data:
  mysql_mecanico_data:

networks:
  taller-net: